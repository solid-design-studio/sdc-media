<div class="cq-step" data-step="07" data-title="What are you expecting from the project?"><div class="cq-step-head"><h2 class="cq-h2">What are you expecting from the project?</h2></div><div class="cq-q" data-q="07-1" data-type="single"><p class="cq-label"><span class="cq-qn">1.</span>Which of the following best describes what you expect the final outcome to be?</p><p class="cq-hint"><span>Choose one:</span><span class="cq-count"></span></p><div class="cq-options cq-options-1"><div class="cq-opt" data-opt="Improvements to the existing identity"><label class="w-radio cq-radio"><input type="radio" class="w-radio-input" id="cq-07-1-0" name="07.1 Expected outcome" value="Improvements to the existing identity"><span class="w-form-label">Improvements to the existing identity</span></label></div><div class="cq-opt" data-opt="A refreshed visual identity"><label class="w-radio cq-radio"><input type="radio" class="w-radio-input" id="cq-07-1-1" name="07.1 Expected outcome" value="A refreshed visual identity"><span class="w-form-label">A refreshed visual identity</span></label></div><div class="cq-opt" data-opt="A new visual direction"><label class="w-radio cq-radio"><input type="radio" class="w-radio-input" id="cq-07-1-2" name="07.1 Expected outcome" value="A new visual direction"><span class="w-form-label">A new visual direction</span></label></div><div class="cq-opt" data-opt="A new brand identity"><label class="w-radio cq-radio"><input type="radio" class="w-radio-input" id="cq-07-1-3" name="07.1 Expected outcome" value="A new brand identity"><span class="w-form-label">A new brand identity</span></label></div><div class="cq-opt" data-opt="A visual system that can be applied consistently"><label class="w-radio cq-radio"><input type="radio" class="w-radio-input" id="cq-07-1-4" name="07.1 Expected outcome" value="A visual system that can be applied consistently"><span class="w-form-label">A visual system that can be applied consistently</span></label></div><div class="cq-opt cq-opt-unsure" data-opt="Not sure, I would like Solid to recommend the right outcome"><label class="w-radio cq-radio"><input type="radio" class="w-radio-input" id="cq-07-1-5" name="07.1 Expected outcome" value="Not sure, I would like Solid to recommend the right outcome"><span class="w-form-label">Not sure, I would like Solid to recommend the right outcome</span></label></div><div class="cq-opt" data-opt="Other"><label class="w-radio cq-radio"><input type="radio" class="w-radio-input" id="cq-07-1-6" name="07.1 Expected outcome" value="Other"><span class="w-form-label">Other</span></label></div></div><div class="cq-other" data-for="Other"><input class="cq-input" type="text" name="07.1 Expected outcome — Other" placeholder="Please specify"></div></div><div class="cq-q" data-q="07-2" data-type="single" data-show-if='{"q": "01-1", "equals": "Existing Brand"}'><p class="cq-label"><span class="cq-qn">2.</span>How would you describe your ideal outcome?</p><p class="cq-hint"><span>Choose one:</span><span class="cq-count"></span></p><div class="cq-options cq-options-1"><div class="cq-opt" data-opt="“It should still feel like us, just better”"><label class="w-radio cq-radio"><input type="radio" class="w-radio-input" id="cq-07-2-0" name="07.2 Ideal outcome" value="“It should still feel like us, just better”"><span class="w-form-label">“It should still feel like us, just better”</span></label></div><div class="cq-opt" data-opt="“It should clearly feel like an updated version of us”"><label class="w-radio cq-radio"><input type="radio" class="w-radio-input" id="cq-07-2-1" name="07.2 Ideal outcome" value="“It should clearly feel like an updated version of us”"><span class="w-form-label">“It should clearly feel like an updated version of us”</span></label></div><div class="cq-opt" data-opt="“It should feel like us in a new context”"><label class="w-radio cq-radio"><input type="radio" class="w-radio-input" id="cq-07-2-2" name="07.2 Ideal outcome" value="“It should feel like us in a new context”"><span class="w-form-label">“It should feel like us in a new context”</span></label></div><div class="cq-opt" data-opt="“We are open to discovering what the brand could become”"><label class="w-radio cq-radio"><input type="radio" class="w-radio-input" id="cq-07-2-3" name="07.2 Ideal outcome" value="“We are open to discovering what the brand could become”"><span class="w-form-label">“We are open to discovering what the brand could become”</span></label></div><div class="cq-opt cq-opt-unsure" data-opt="“We are not sure yet”"><label class="w-radio cq-radio"><input type="radio" class="w-radio-input" id="cq-07-2-4" name="07.2 Ideal outcome" value="“We are not sure yet”"><span class="w-form-label">“We are not sure yet”</span></label></div></div></div></div>
